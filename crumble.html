<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Crumble — historical effect reconstruction</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #111; }
    body { display: grid; place-items: center; font: 14px/1.3 system-ui, sans-serif; }
    #screen {
      width: min(100vw, calc(100vh * 1.6));
      height: min(100vh, calc(100vw / 1.6));
      background: white;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      cursor: none;
      box-shadow: 0 0 60px #000;
    }
    #controls {
      position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
      display: flex; align-items: center; gap: 8px; padding: 8px 10px;
      color: #eee; background: rgb(20 20 20 / .88); border: 1px solid #666;
      border-radius: 7px; backdrop-filter: blur(6px); cursor: default;
      transition: opacity .2s;
    }
    #controls.hidden { opacity: 0; pointer-events: none; }
    button, select { font: inherit; }
    button { padding: 4px 9px; }
    label { white-space: nowrap; }
    input[type="range"] { width: 110px; vertical-align: middle; }
    #about {
      position: fixed; inset: 0; display: none; place-items: center; background: rgb(0 0 0 / .65);
      cursor: default;
    }
    #about.open { display: grid; }
    #about section { max-width: 620px; margin: 20px; padding: 22px; background: #fff; color: #111; border-radius: 8px; }
    kbd { border: 1px solid #aaa; border-bottom-width: 2px; border-radius: 3px; padding: 1px 4px; }
  </style>
</head>
<body>
  <canvas id="screen" width="720" height="450" aria-label="Monochrome screen crumbling into pixel dust"></canvas>
  <div id="controls">
    <button id="toggle">Pause</button>
    <button id="reset">Reset</button>
    <label>Decay <input id="decay" type="range" min="1" max="100" value="34"></label>
    <button id="fullscreen">Fullscreen</button>
    <button id="info">About</button>
  </div>
  <div id="about" role="dialog" aria-modal="true">
    <section>
      <h2>CRUMBLE reconstruction</h2>
      <p>This is newly written code inspired by a historical screen prank. It is not recovered Yale, SunOS, or Apollo source code and it never touches the real desktop or framebuffer.</p>
      <p>Keys: <kbd>Space</kbd> pause, <kbd>R</kbd> reset, <kbd>F</kbd> fullscreen, <kbd>H</kbd> hide controls, <kbd>Esc</kbd> close this panel.</p>
      <button id="closeAbout">Close</button>
    </section>
  </div>
<script>
(() => {
  'use strict';
  const W = 720, H = 450;
  const EMPTY = 0, FIXED = 1, SETTLED = 2;
  const canvas = document.querySelector('#screen');
  const ctx = canvas.getContext('2d', { alpha: false });
  const source = document.createElement('canvas');
  source.width = W; source.height = H;
  const sx = source.getContext('2d', { willReadFrequently: true });
  const cells = new Uint8Array(W * H);
  let particles = [];
  let fixedCount = 0;
  let running = true;
  let seed = 0x4352554d;
  let last = 0, accumulator = 0;
  let crumbleStartsAt = 0;

  const sample = [
    'SunOS UNIX (workstation)                      Thu Nov 12 14:37',
    '',
    'login: guest',
    'Last login: Thu Nov 12 14:31:08 on console',
    '',
    'workstation% ls -l',
    'total 27',
    '-rw-r--r--  1 guest  staff   1843 Nov 10  notes',
    '-rw-r--r--  1 guest  staff  12288 Nov 11  report',
    'drwxr-xr-x  2 guest  staff    512 Nov 12  src',
    '',
    'workstation% more notes',
    '',
    'The display appears perfectly ordinary.',
    'Watch the black pixels at the edges of the letters.',
    'They loosen, fall, and collect like dust at the bottom.',
    '',
    'This modern reconstruction runs only inside this window.',
    'It does not alter the desktop or access a framebuffer.',
    '',
    'workstation% _'
  ];

  function rand() {
    seed ^= seed << 13; seed ^= seed >>> 17; seed ^= seed << 5;
    return (seed >>> 0) / 4294967296;
  }
  const index = (x, y) => y * W + x;
  const occupied = (x, y) => x < 0 || x >= W || y >= H || (y >= 0 && cells[index(x, y)] !== EMPTY);

  function reset() {
    cells.fill(EMPTY); particles = []; fixedCount = 0; seed = 0x4352554d;
    crumbleStartsAt = performance.now() + 3000;
    sx.fillStyle = '#fff'; sx.fillRect(0, 0, W, H);
    sx.fillStyle = '#000';
    sx.font = '16px "Lucida Console", "DejaVu Sans Mono", "Liberation Mono", monospace';
    sx.textBaseline = 'top';
    sample.forEach((line, i) => sx.fillText(line, 24, 20 + i * 19));
    const image = sx.getImageData(0, 0, W, H).data;
    for (let i = 0; i < cells.length; i++) {
      // Convert the antialiased browser font to a solid one-bit bitmap. A
      // generous threshold keeps complete strokes instead of fax-like gaps.
      if (image[i * 4] < 208) { cells[i] = FIXED; fixedCount++; }
    }
    draw();
  }

  function erode() {
    if (!fixedCount) return;
    const strength = Number(document.querySelector('#decay').value);
    const target = Math.max(1, Math.round(strength * 0.23));
    let made = 0, attempts = target * 45;
    while (made < target && attempts-- > 0 && fixedCount) {
      const x = 1 + Math.floor(rand() * (W - 2));
      const y = 1 + Math.floor(rand() * (H - 3));
      const i = index(x, y);
      if (cells[i] !== FIXED) continue;
      const exposed = cells[i - 1] === EMPTY || cells[i + 1] === EMPTY ||
        cells[i - W] === EMPTY || cells[i + W] === EMPTY;
      if (!exposed && rand() > 0.035) continue;
      cells[i] = EMPTY; fixedCount--;
      particles.push({ x: x + rand() * .2 - .1, y, vy: .12 + rand() * .28 });
      made++;
    }
  }

  function settle(p, x, y) {
    x = Math.max(0, Math.min(W - 1, x));
    y = Math.max(0, Math.min(H - 1, y));
    cells[index(x, y)] = SETTLED;
    p.dead = true;
  }

  function moveParticles() {
    for (let n = particles.length - 1; n >= 0; n--) {
      const p = particles[n];
      p.vy = Math.min(3.2, p.vy + .075);
      const x = Math.round(p.x);
      let remaining = p.vy;
      let stopped = false;
      while (remaining > 0 && !stopped) {
        const step = Math.min(1, remaining);
        const nextY = p.y + step;
        const yi = Math.floor(nextY + .5);
        if (yi >= H) { settle(p, x, H - 1); stopped = true; break; }
        if (occupied(x, yi)) {
          const dirs = rand() < .5 ? [-1, 1] : [1, -1];
          let slid = false;
          for (const d of dirs) {
            if (!occupied(x + d, yi) && !occupied(x + d, yi - 1)) {
              p.x += d; p.y = yi; p.vy *= .52; slid = true; break;
            }
          }
          if (!slid) { settle(p, x, Math.max(0, yi - 1)); stopped = true; }
        } else p.y = nextY;
        remaining -= step;
      }
    }
    particles = particles.filter(p => !p.dead);
  }

  function update(now) {
    if (now >= crumbleStartsAt) erode();
    moveParticles();
  }

  function draw() {
    const image = ctx.createImageData(W, H);
    image.data.fill(255);
    for (let i = 0; i < cells.length; i++) {
      if (cells[i] !== EMPTY) {
        const o = i * 4; image.data[o] = image.data[o + 1] = image.data[o + 2] = 0;
      }
    }
    for (const p of particles) {
      const x = Math.round(p.x), y = Math.round(p.y);
      if (x >= 0 && x < W && y >= 0 && y < H) {
        const o = index(x, y) * 4; image.data[o] = image.data[o + 1] = image.data[o + 2] = 0;
      }
    }
    ctx.putImageData(image, 0, 0);
  }

  function frame(now) {
    const dt = Math.min(100, now - last); last = now;
    if (running) {
      accumulator += dt;
      while (accumulator >= 20) { update(now); accumulator -= 20; }
      draw();
    }
    requestAnimationFrame(frame);
  }

  function toggle() {
    running = !running;
    document.querySelector('#toggle').textContent = running ? 'Pause' : 'Resume';
  }
  document.querySelector('#toggle').addEventListener('click', toggle);
  document.querySelector('#reset').addEventListener('click', reset);
  document.querySelector('#fullscreen').addEventListener('click', () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen());
  document.querySelector('#info').addEventListener('click', () => document.querySelector('#about').classList.add('open'));
  document.querySelector('#closeAbout').addEventListener('click', () => document.querySelector('#about').classList.remove('open'));
  document.querySelector('#about').addEventListener('click', e => { if (e.target.id === 'about') e.currentTarget.classList.remove('open'); });
  addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.key.toLowerCase() === 'r') reset();
    else if (e.key.toLowerCase() === 'f') document.querySelector('#fullscreen').click();
    else if (e.key.toLowerCase() === 'h') document.querySelector('#controls').classList.toggle('hidden');
    else if (e.key === 'Escape') document.querySelector('#about').classList.remove('open');
  });
  let hideTimer;
  addEventListener('mousemove', () => {
    const controls = document.querySelector('#controls'); controls.classList.remove('hidden');
    clearTimeout(hideTimer); hideTimer = setTimeout(() => controls.classList.add('hidden'), 3200);
  });

  reset();
  requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
})();
</script>
</body>
</html>
